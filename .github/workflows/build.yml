name: CS2 Optimized Radar CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: MSBuild Araclarini Yukle
      uses: microsoft/setup-msbuild@v2

    - name: CMake Projesini Yapilandir
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Projeyi Release Olarak Derle
      run: cmake --build build --config Release

    - name: Derlenen Calistirilabilir EXE'yi Yukle
      uses: actions/upload-artifact@v4
      with:
        name: CS2-Optimized-Radar-EXE
        path: build/Release/*.exe
        
