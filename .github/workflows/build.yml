name: CS2_Entity_Reader_Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x

    - name: Restore
      run: dotnet restore

    - name: Publish EXE
      # Tek bir EXE dosyası üretir, tüm bağımlılıkları içine gömer
      run: dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishReadyToRun=true /p:DebugType=None /p:DebugSymbols=false

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CS2_Guncel_Reader
        path: bin/Release/net8.0/win-x64/publish/*.exe
        
