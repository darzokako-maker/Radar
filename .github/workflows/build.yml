name: C++ External EXE Automated Builder

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Repoyu Bilgisayara Cek
      uses: actions/checkout@v4

    - name: C++ Projesini x64 Release EXE Olarak Derle
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cl.exe /O2 /EHsc main.cpp /MT /link /OUT:CS2_Web_Radar.exe /MACHINE:X64 user32.lib ws2_32.lib

    - name: Derlenen EXE Dosyasını GitHub'a Yukle (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-CS2-WebRadar
        path: CS2_Web_Radar.exe
        
