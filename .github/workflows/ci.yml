name: CS2 Precise Radar CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify_build:
    runs-on: windows-latest

    steps:
    - name: Depoyu Indir
      uses: actions/checkout@v4

    - name: Python Ortamını Kur (3.11)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Bağımlılıkları Dağıt
      run: |
        python -m pip install --upgrade pip
        pip install websockets pyinstaller

    - name: Sözdizimi Kontrolü (Syntax Check)
      run: |
        python -m py_compile main.py

    - name: PyInstaller Exe Paketleme Testi
      run: |
        pyinstaller --onefile --noconsole --clean main.py

    # --- YENİ EKLENEN ADIM: EXE DOSYASINI GİTHUB'A YÜKLE ---
    - name: Exe Dosyasını Çıktı Olarak Paylaş
      uses: actions/upload-artifact@v4
      with:
        name: CS2-Radar-Executable
        path: dist/main.exe
        
