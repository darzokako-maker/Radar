<!DOCTYPE html>
<html>
<head>
    <title>CS2 Canli Web Radar</title>
    <style>
        body { background: #0f111a; color: #a6accd; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #fff; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        #radar { width: 550px; height: 550px; background: radial-gradient(circle, #1a1d2e 0%, #0b0c16 100%); border: 3px solid #2f3456; position: relative; margin: 15px auto; border-radius: 50%; box-shadow: 0 0 20px rgba(0,0,0,0.6); overflow: hidden; }
        
        /* Radar Çizgileri */
        .radar-line-h { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(47, 52, 86, 0.5); }
        .radar-line-v { position: absolute; left: 50%; top: 0; width: 1px; height: 100%; background: rgba(47, 52, 86, 0.5); }
        .radar-ring { position: absolute; top: 50%; left: 50%; border: 1px solid rgba(47, 52, 86, 0.3); border-radius: 50%; transform: translate(-50%, -50%); }

        .player { position: absolute; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%, -50%); transition: all 0.05s linear; z-index: 10; }
        .t { background: #ff5370; box-shadow: 0 0 10px #ff5370; border: 2px solid #fff; }
        .ct { background: #82aaff; box-shadow: 0 0 10px #82aaff; border: 2px solid #fff; }
        .name { position: absolute; color: #fff; font-size: 11px; font-weight: 600; margin-top: -18px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: rgba(0,0,0,0.75); padding: 2px 5px; border-radius: 3px; pointer-events: none; }
        
        #panel { background: #1a1d2e; width: 520px; margin: 10px auto; padding: 10px; border-radius: 8px; border: 1px solid #2f3456; }
        label { margin: 0 10px; font-size: 13px; }
        input { width: 60px; background: #0f111a; border: 1px solid #2f3456; color: #fff; padding: 3px; text-align: center; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>CS2 Professional Web Radar</h1>
    <div id="status" style="color: #ecc48d; font-size: 14px;">Sunucu aranıyor...</div>
    
    <div id="radar">
        <div class="radar-line-h"></div>
        <div class="radar-line-v"></div>
        <div class="radar-ring" style="width: 150px; height: 150px;"></div>
        <div class="radar-ring" style="width: 330px; height: 330px;"></div>
        <div class="radar-ring" style="width: 500px; height: 500px;"></div>
        <div id="container"></div>
    </div>

    <div id="panel">
        <label>Harita Yakınlaştırma (Hassasiyet): <input type="number" id="zoom" value="12" step="0.5"></label>
        <label>Eksen Ayarı X: <input type="number" id="offsetX" value="0"></label>
        <label>Eksen Ayarı Y: <input type="number" id="offsetY" value="0"></label>
    </div>

    <script>
        setInterval(async () => {
            try {
                let res = await fetch('http://localhost:8080');
                let players = await res.json();
                
                document.getElementById('status').innerHTML = `Bağlantı Başarılı. Aktif İzlenen Nesne: <b style='color:#c3e88d'>${players.length}</b>`;
                
                let container = document.getElementById('container');
                container.innerHTML = ''; 

                let zoom = parseFloat(document.getElementById('zoom').value) || 12;
                let offsetX = parseFloat(document.getElementById('offsetX').value) || 0;
                let offsetY = parseFloat(document.getElementById('offsetY').value) || 0;

                players.forEach(p => {
                    let dot = document.createElement('div');
                    dot.className = 'player ' + (p.team === 2 ? 't' : 'ct');
                    
                    // Engine koordinatlarını dinamik 2D yüzeye projeksiyonlama
                    let mapX = 275 + ((p.x + offsetX) / zoom);
                    let mapY = 275 - ((p.y + offsetY) / zoom);

                    // Sınır dışına taşan noktaları gizle
                    if(mapX >= 0 && mapX <= 550 && mapY >= 0 && mapY <= 550) {
                        dot.style.left = mapX + 'px';
                        dot.style.top = mapY + 'px';
                        dot.innerHTML = `<span class="name">${p.name} [${p.health}]</span>`;
                        container.appendChild(dot);
                    }
                });
            } catch(e) {
                document.getElementById('status').innerHTML = "<b style='color:#ff5370'>HATA: Radar .exe sunucusuna baglanilamadi! Programın açık olduğundan emin olun.</b>";
            }
        }, 60);
    </script>
</body>
</html>
